[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "north-america-1609"
version = "0.1.0"
description = "Evidence-traceable North America 1609 environmental reconstruction pipeline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "rasterio>=1.3,<2", "shapely>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
na1609 = "na1609.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
