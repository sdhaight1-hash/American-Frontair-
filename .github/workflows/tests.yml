name: Validate GIS pipeline
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: pytest -q
      - run: na1609 fetch-dem --region regions/hudson_pilot.json --dry-run
      - run: na1609 check-evidence --region regions/hudson_pilot.json --input data/historical/hudson_1609_evidence.geojson
